/* ─── the uplink ─── */
let runtimeKey = '', runtimeCode = '';   /* typed into the HUD; memory only */
const relayUrl = () => ((SETTINGS.UPLINK && SETTINGS.UPLINK.FUNCTION_URL) || '').trim();
const effectiveKey = () => (SETTINGS.API_KEY || '').trim() || runtimeKey;
const effectiveCode = () => ((SETTINGS.UPLINK && SETTINGS.UPLINK.ACCESS_CODE) || '').trim() || runtimeCode;

async function uplink(override){
  /* output ceiling: the managed channel is fixed at 1000; your own
     key or relay unlocks real deep-work budgets in HEAVY tier */
  const managed = !relayUrl() && !effectiveKey();
  const sys = (override && override.system) || systemPrompt();
  const msgs = (override && override.messages) || apiMessages();
  const want = (override && override.maxTokens) || (tier === 'HEAVY' ? 8000 : 2000);
  const maxTok = managed ? 1000 : want;
  const req = {
    model:'claude-sonnet-4-6',
    max_tokens:maxTok,
    system:sys,
    messages:msgs
  };
  if(SETTINGS.WEB_SEARCH){
    req.tools = [{ type:'web_search_20250305', name:'web_search' }];
  }
  const payload = JSON.stringify(req);
  let res;
  const relay = relayUrl();
  if(relay){
    /* Swim-site architecture: our Supabase function holds the real key
       server-side; the page only carries the access code, in memory. */
    res = await fetch(relay, {
      method:'POST',
      headers:{'Content-Type':'application/json','x-jarvis-code':effectiveCode()},
      body:JSON.stringify({ system:sys, messages:msgs, tier:tier, maxTokens:maxTok })
    });
  }else{
    /* Managed channel inside claude.ai needs no key; a standalone copy
       authenticates with Anthropic's browser headers. */
    const headers = {'Content-Type':'application/json'};
    const key = effectiveKey();
    if(key){
      headers['x-api-key'] = key;
      headers['anthropic-version'] = '2023-06-01';
      headers['anthropic-dangerous-direct-browser-access'] = 'true';
    }
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers, body:payload
    });
  }
  const data = await res.json();
  if(data.error) throw new Error(data.error.message || 'Unknown uplink error');
  if(!res.ok) throw new Error(data.message || data.msg || ('HTTP ' + res.status));
  return (data.content||[])
    .filter(b=>b.type==='text').map(b=>b.text).join('\n').trim()
    || '…no transmission received.';
}

function finishTurn(){
  pending = false;
  sendBtn.disabled = false;
  input.placeholder = 'SPEAK OR TYPE';
}

async function runTurn(){
  pending = true;
  sendBtn.disabled = true;
  setState('thinking');
  input.placeholder = 'PROCESSING…';
  const thinking = addThinking();
  const t0 = performance.now();
  try{
    const reply = await uplink();
    const ms = Math.round(performance.now()-t0);
    thinking.stop();
    pushHistory('assistant', reply);
    latencies.push(ms); paintLatency();
    $('vLat').textContent = ms+' MS';
    $('vMsgs').textContent = String(history.length).padStart(2,'0');
    finishTurn();
    deliver(thinking.body, reply);
  }catch(err){
    thinking.stop();
    thinking.body.parentElement.remove();
    finishTurn();
    const emsg = err.message || '';
    if(/missing authorization header/i.test(emsg)){
      addMsg('fault', 'UPLINK BLOCKED AT SUPABASE\u2019S FRONT DOOR \u2014 "Enforce JWT verification" is still ON for the jarvis-ai function, so requests never reach it. Open the function in Supabase, turn that setting OFF, redeploy, then try again.');
      setState(handsFree ? 'listening' : 'idle');
      if(handsFree) startListening();
      return;
    }
    const authIssue = /auth|api.?key|401|403|cors|credit|billing|access.?code/i.test(emsg);
    if(authIssue){
      if(relayUrl() && !((SETTINGS.UPLINK && SETTINGS.UPLINK.ACCESS_CODE) || '').trim()){
        const rejected = !!runtimeCode;  /* a code was entered and bounced */
        runtimeCode = '';
        requestAuthorization('code', rejected);
        return;
      }
      if(!relayUrl() && !(SETTINGS.API_KEY || '').trim()){
        const rejected = !!runtimeKey;   /* a key was entered and bounced */
        runtimeKey = '';
        requestAuthorization('key', rejected);
        return;
      }
    }
    const fb = addMsg('fault', 'UPLINK DISRUPTED — ' + err.message);
    fb.innerHTML += '<br><button class="retrybtn" type="button">RETRY \u25b8</button>';
    setState(handsFree ? 'listening' : 'idle');
    if(handsFree) startListening();
  }finally{
    if(!handsFree && !document.querySelector('.auth-key')) input.focus();
  }
}

async function transmit(forcedText){
  const text = (forcedText !== undefined ? forcedText : input.value).trim();
  if(!text || pending) return;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  speaking = false;
  pauseListening();

  input.value = '';
  addMsg('user', text);
  pushHistory('user', text);
  await runTurn();
}

/* ─── on-screen authorization (bring-your-own-key / access code) ───
   Appears only when a standalone or published copy needs credentials.
   Whatever is entered lives in memory for this visit and is never
   written into the page — the published file contains no secret.    */
function requestAuthorization(kind, rejected){
  standDown();                             /* credentials are typed, not spoken */
  setState('idle');
  const isCode = kind === 'code';
  const body = addMsg('auth', null);
  const note = isCode
    ? (rejected
        ? 'THE RELAY REJECTED THAT CODE. It must match your JARVIS_ACCESS_CODE secret in Supabase exactly — capital letters count, and no extra spaces on either side. If you recently changed the secret, hit redeploy on the jarvis-ai function so it picks up the new value, then enter it again below.'
        : 'This copy relays through your Supabase function, which is asking for your access code (the JARVIS_ACCESS_CODE passphrase you set in Supabase secrets). It is held in memory for this visit only and never saved into the page.')
    : (rejected
        ? 'ANTHROPIC REJECTED THAT KEY. Confirm it is active with billing credit at console.anthropic.com, then paste it again below — the full key, no spaces. It stays in memory for this visit only.'
        : 'This copy is running on its own uplink, so it needs your Anthropic API key to think. Paste it below — it is held in memory for this visit only and never saved into the page. Keys begin with sk-ant- and come from console.anthropic.com \u2192 API Keys.');
  body.innerHTML =
    '<div class="auth-note">' + note + '</div>' +
    '<div class="auth-row">' +
      '<input class="auth-key" type="' + (isCode ? 'text' : 'password') + '" autocomplete="off" spellcheck="false" placeholder="' + (isCode ? 'ACCESS CODE' : 'sk-ant-\u2026') + '" aria-label="' + (isCode ? 'Access code' : 'Anthropic API key') + '">' +
      '<button class="chip auth-go" type="button">AUTHORIZE</button>' +
    '</div>' +
    '<div class="auth-err" hidden></div>';
  const keyInput = body.querySelector('.auth-key');
  const goBtn = body.querySelector('.auth-go');
  const errLine = body.querySelector('.auth-err');
  const submit = ()=>{
    const v = keyInput.value.trim();
    if(!v){ return; }
    if(!isCode && !/^sk-ant-/.test(v)){
      errLine.hidden = false;
      errLine.textContent = 'NOT AN ANTHROPIC KEY \u2014 it must start with sk-ant-. Supabase and other services\u2019 keys will not work here.';
      return;
    }
    if(isCode){ runtimeCode = v; } else { runtimeKey = v; }
    body.innerHTML = '<div class="auth-note">AUTHORIZED \u2014 held in memory for this visit. Resuming your last transmission.</div>';
    runTurn();                             /* history already holds the message */
  };
  goBtn.addEventListener('click', submit);
  keyInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  scrollLog();
  keyInput.focus();
}

sendBtn.addEventListener('click', ()=> handleUtterance(input.value.trim()));
input.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const t = input.value.trim();
    if(t) handleUtterance(t);
  }
});

/* ─── config lint: catch the classic mix-ups before they cost a trip ─── */
function lintConfig(){
  const problems = [];
  const k = (SETTINGS.API_KEY || '').trim();
  if(k && /^https?:\/\//i.test(k)){
    problems.push('API_KEY contains a URL. That link belongs in SETTINGS.UPLINK.FUNCTION_URL — set API_KEY back to "" (empty).');
  } else if(k && !/^sk-ant-/.test(k)){
    problems.push('API_KEY does not start with sk-ant-, so it is not an Anthropic key. Supabase keys and access codes never go in this slot.');
  }
  const u = relayUrl();
  if(u && !/^https?:\/\//i.test(u)){
    problems.push('UPLINK.FUNCTION_URL should be the full https:// link Supabase shows after deploy.');
  }
  if(problems.length) addMsg('fault', 'CONFIG CHECK — ' + problems.join('\n'));
}

function finishBoot(){
  $('boot').classList.add('done');
  setTimeout(()=> { const b=$('boot'); if(b) b.remove(); }, 1000);
  const body = addMsg('ai', null);
  pushHistory('assistant', mode().GREETING);
  deliver(body, mode().GREETING);
  if(!('ontouchstart' in window)) input.focus();
}

/* ─── the particle core: the hologram's heart ─── */
function initCore(){
  const cv = document.getElementById('coreCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let W=0,H=0,R=0,cx=0,cy=0;
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  function size(){
    const r = cv.parentElement.getBoundingClientRect();
    W = Math.max(60, r.width); H = Math.max(60, r.height);
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H/2; R = Math.min(W,H)*0.40;
  }
  size();
  window.addEventListener('resize', size);
  /* a true sphere: points fill the volume, densest at the heart */
  const N = (window.innerWidth > 1120 ? 640 : 420);
  const P = [];
  for(let i=0;i<N;i++){
    const th = Math.random()*6.2832, ph = Math.acos(2*Math.random()-1);
    const rr = Math.pow(Math.random(), 0.5);
    P.push({x:rr*Math.sin(ph)*Math.cos(th), y:rr*Math.sin(ph)*Math.sin(th),
            z:rr*Math.cos(ph), r:rr, tw:Math.random()*6.2832});
  }
  function holoRGB(){
    const c = getComputedStyle(document.documentElement).getPropertyValue('--holo').trim();
    const m = c.match(/^#?([0-9a-f]{6})$/i);
    if(m){ const n = parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255]; }
    return [53,224,255];
  }
  let rgb = holoRGB(), ang = 0, t = 0, fc = 0;
  const tilt = 0.35, St = Math.sin(tilt), Ct = Math.cos(tilt);
  function frame(){
    fc++; if(fc % 90 === 0) rgb = holoRGB();
    const st = (coreWrap && coreWrap.dataset.state) || 'idle';
    const spin = st==='thinking' ? .045 : st==='speaking' ? .016 : st==='listening' ? .011 : .006;
    t += 1; ang += spin;
    const pulse = st==='speaking' ? 1+Math.sin(t*.16)*.06
                : st==='thinking' ? 1+Math.sin(t*.2)*.03
                : st==='listening' ? 1+Math.sin(t*.05)*.04
                : 1+Math.sin(t*.02)*.02;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    /* white-hot heart, exactly like the reel */
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,R*.62*pulse);
    g.addColorStop(0,'rgba(255,255,255,.95)');
    g.addColorStop(.18,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.6)');
    g.addColorStop(.5,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.16)');
    g.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx,cy,R*.62*pulse,0,7); ctx.fill();
    const S = Math.sin(ang), C = Math.cos(ang);
    for(const p of P){
      /* spin about Y, fixed tilt about X, project with depth */
      const x1 = p.x*C - p.z*S,  z1 = p.x*S + p.z*C;
      const y1 = p.y*Ct - z1*St, z2 = p.y*St + z1*Ct;
      const breathe = pulse + Math.sin(t*.04 + p.tw)*.012;
      const px = cx + x1*R*breathe, py = cy + y1*R*breathe;
      const depth = (z2+1)/2;
      const al = (0.12 + 0.7*depth) * (0.45 + 0.55*(1-p.r));
      const sz = Math.max(0.7, (0.5 + depth*1.9) * (R/150));
      ctx.fillStyle = 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+al.toFixed(3)+')';
      ctx.fillRect(px, py, sz, sz);
    }
    ctx.globalCompositeOperation = 'source-over';
    if(!reducedMotion) requestAnimationFrame(frame);
  }
  frame();
}

/* ─── the seeker: multi-layer sweep instrument ─── */
function initRadar(){
  const cv = document.getElementById('radarCanvas');
  if(!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio||1, 2);
  const TAU = 6.28318;
  let S = 216, c = S/2, R = c-8;
  function size(){
    const w = cv.clientWidth || cv.parentElement.clientWidth || 216;
    S = Math.max(120, Math.min(240, w));
    cv.width = S*DPR; cv.height = S*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    c = S/2; R = c-8;
  }
  size();
  window.addEventListener('resize', size);
  function rgbNow(){
    const m = (getComputedStyle(document.documentElement).getPropertyValue('--holo')||'').trim().match(/#?([0-9a-f]{6})/i);
    if(m){ const n = parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255]; }
    return [53,224,255];
  }
  let rgb = rgbNow(), fc = 0, sweep = 0, sector = 2.1;
  const col = a => 'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';
  /* segmented outer data ring (fixed pattern, slow rotation) */
  const segs = [];
  for(let a=0; a<TAU;){
    const span = 0.12 + Math.random()*0.5;
    segs.push({a, span:span*0.72, al:0.10 + Math.random()*0.3});
    a += span;
  }
  const IDS = ['A3','C7','E2','F5','B9','D4','H1'];
  const blips = [];
  for(let i=0;i<6;i++) blips.push({id:IDS[i], a:Math.random()*TAU,
    r:0.24+Math.random()*0.6, drift:(Math.random()-.5)*0.0014,
    wob:Math.random()*TAU, glow:0});
  function frame(){
    fc++; if(fc % 120 === 0) rgb = rgbNow();
    const think = document.body.classList.contains('is-thinking');
    const spd = think ? 0.052 : 0.026;
    sweep = (sweep + spd) % TAU;
    sector = (sector + 0.0022) % TAU;
    ctx.clearRect(0,0,S,S);

    /* ── outer segmented data ring + dashed bezel ── */
    ctx.save(); ctx.translate(c,c); ctx.rotate(fc*0.0016);
    ctx.lineWidth = 2.4;
    for(const s of segs){
      ctx.strokeStyle = col(s.al);
      ctx.beginPath(); ctx.arc(0,0,R*0.985,s.a,s.a+s.span); ctx.stroke();
    }
    ctx.restore();
    ctx.save(); ctx.translate(c,c); ctx.rotate(-fc*0.0021);
    ctx.strokeStyle = col(.4); ctx.lineWidth = 1; ctx.setLineDash([2,5]);
    ctx.beginPath(); ctx.arc(0,0,R*0.93,0,TAU); ctx.stroke(); ctx.restore();
    ctx.setLineDash([]);

    const Ri = R*0.88;                        /* scope interior radius */

    /* ── designated scan sector (slowly patrolling wedge) ── */
    ctx.save(); ctx.translate(c,c);
    ctx.fillStyle = col(think ? .06 : .035);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,Ri,sector,sector+0.7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = col(.28); ctx.lineWidth = 1;
    for(const a of [sector, sector+0.7]){
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a)*Ri, Math.sin(a)*Ri); ctx.stroke();
    }
    ctx.restore();

    /* ── range rings, middle one with micro-ticks ── */
    ctx.strokeStyle = col(.2); ctx.lineWidth = 1;
    for(const k of [0.3,0.56,0.82]){
      ctx.beginPath(); ctx.arc(c,c,Ri*k,0,TAU); ctx.stroke();
    }
    ctx.strokeStyle = col(.3);
    for(let k=0;k<48;k++){
      const a = k/48*TAU, r1 = Ri*0.56-1.6, r2 = Ri*0.56+1.6;
      ctx.beginPath();
      ctx.moveTo(c+Math.cos(a)*r1, c+Math.sin(a)*r1);
      ctx.lineTo(c+Math.cos(a)*r2, c+Math.sin(a)*r2); ctx.stroke();
    }

    /* ── crosshair + diagonals ── */
    ctx.strokeStyle = col(.18);
    ctx.beginPath(); ctx.moveTo(c-Ri,c); ctx.lineTo(c+Ri,c);
    ctx.moveTo(c,c-Ri); ctx.lineTo(c,c+Ri); ctx.stroke();
    ctx.strokeStyle = col(.08);
    ctx.beginPath();
    ctx.moveTo(c-Ri*.71,c-Ri*.71); ctx.lineTo(c+Ri*.71,c+Ri*.71);
    ctx.moveTo(c-Ri*.71,c+Ri*.71); ctx.lineTo(c+Ri*.71,c-Ri*.71); ctx.stroke();

    /* ── bearing ticks; numerals every 30° on larger scopes ── */
    const big = S >= 170;
    for(let k=0;k<36;k++){
      const a = k/36*TAU - Math.PI/2, L = k%3===0 ? 5 : 2.5;
      ctx.strokeStyle = col(k%9===0 ? .6 : .26);
      ctx.beginPath();
      ctx.moveTo(c+Math.cos(a)*(Ri-L), c+Math.sin(a)*(Ri-L));
      ctx.lineTo(c+Math.cos(a)*Ri,     c+Math.sin(a)*Ri); ctx.stroke();
    }
    ctx.fillStyle = col(.5);
    ctx.font = (big?5.5:6)+'px "Share Tech Mono", monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for(let k=0;k<12;k++){
      if(!big && k%3!==0) continue;
      const deg = k*30, a = deg/180*Math.PI - Math.PI/2;
      ctx.fillText(String(deg).padStart(3,'0'),
        c+Math.cos(a)*(Ri-12), c+Math.sin(a)*(Ri-12));
    }

    /* ── primary sweep: conic trail + hot leading edge ── */
    ctx.save(); ctx.translate(c,c);
    if(ctx.createConicGradient){
      const g = ctx.createConicGradient(sweep - TAU*0.22, 0, 0);
      g.addColorStop(0, col(0));
      g.addColorStop(0.205, col(.07));
      g.addColorStop(0.219, col(.34));
      g.addColorStop(0.221, col(0));
      g.addColorStop(1, col(0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,Ri,0,TAU); ctx.fill();
    }
    ctx.rotate(sweep);
    let lg = ctx.createLinearGradient(0,0,Ri,0);
    lg.addColorStop(0, col(.95)); lg.addColorStop(1, col(0));
    ctx.strokeStyle = lg; ctx.lineWidth = 1.5;
    ctx.shadowColor = col(.8); ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Ri,0); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.restore();

    /* ── secondary counter-sweep, faint ── */
    ctx.save(); ctx.translate(c,c); ctx.rotate(-sweep*0.62);
    lg = ctx.createLinearGradient(0,0,Ri,0);
    lg.addColorStop(0, col(.25)); lg.addColorStop(1, col(0));
    ctx.strokeStyle = lg; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Ri,0); ctx.stroke();
    ctx.restore();

    /* ── contacts: flare on beam pass, tagged with IDs ── */
    for(const b of blips){
      b.a += b.drift;
      const rr = b.r + Math.sin(fc*0.01 + b.wob)*0.012;
      let d = (sweep - b.a) % TAU; if(d < 0) d += TAU;
      if(d < 0.05) b.glow = 1;
      b.glow *= 0.985;
      const x = c+Math.cos(b.a)*Ri*rr, y = c+Math.sin(b.a)*Ri*rr;
      if(b.glow > .35){
        ctx.shadowColor = col(.9); ctx.shadowBlur = 5;
      }
      ctx.fillStyle = col((.14 + .86*b.glow).toFixed(3));
      ctx.beginPath(); ctx.arc(x,y,1.6 + b.glow*1.6,0,TAU); ctx.fill();
      ctx.shadowBlur = 0;
      if(b.glow > .5){
        ctx.strokeStyle = col(((b.glow-.5)*.8).toFixed(3));
        ctx.beginPath(); ctx.arc(x,y,3+(1-b.glow)*11,0,TAU); ctx.stroke();
      }
      if(b.glow > .35 && big){
        const la = b.a, lx = x+Math.cos(la)*9, ly = y+Math.sin(la)*9;
        ctx.strokeStyle = col((b.glow*.5).toFixed(3));
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(lx,ly); ctx.stroke();
        ctx.fillStyle = col((b.glow*.85).toFixed(3));
        ctx.font = '5.5px "Share Tech Mono", monospace';
        ctx.fillText('T-'+b.id, lx+Math.cos(la)*7, ly+Math.sin(la)*7);
      }
    }

    /* ── center reticle: diamond + rotating tri-arc ── */
    ctx.save(); ctx.translate(c,c); ctx.rotate(fc*0.02);
    ctx.strokeStyle = col(.7); ctx.lineWidth = 1;
    for(let k=0;k<3;k++){
      ctx.beginPath(); ctx.arc(0,0,6.5,k*TAU/3,k*TAU/3+TAU/4.5); ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = col(.95);
    ctx.beginPath();
    ctx.moveTo(c,c-2.6); ctx.lineTo(c+2.6,c); ctx.lineTo(c,c+2.6); ctx.lineTo(c-2.6,c);
    ctx.closePath(); ctx.fill();

    /* ── scanline shimmer across the scope ── */
    ctx.save();
    ctx.beginPath(); ctx.arc(c,c,Ri,0,TAU); ctx.clip();
    const sy = (fc*0.7 % (S*1.5)) - S*0.25;
    const sg = ctx.createLinearGradient(0,sy,0,sy+16);
    sg.addColorStop(0,'rgba(255,255,255,0)');
    sg.addColorStop(.5,'rgba(255,255,255,.045)');
    sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0,sy,S,16);
    ctx.restore();

    /* ── live corner readouts (all self-measured) ── */
    ctx.fillStyle = col(.6);
    ctx.font = '6px "Share Tech Mono", monospace';
    ctx.textAlign = 'left';  ctx.textBaseline = 'top';
    ctx.fillText('SCN ' + (TAU/spd/60).toFixed(1) + 'S', 3, 2);
    ctx.textAlign = 'right';
    ctx.fillText('CNT 0' + blips.length, S-3, 2);
    ctx.textBaseline = 'bottom';
    const brg = Math.round(((sweep + Math.PI/2)/TAU*360)) % 360;
    ctx.textAlign = 'left';
    ctx.fillText('BRG ' + String(brg).padStart(3,'0') + '\u00b0', 3, S-2);
    ctx.textAlign = 'right';
    const sec = Math.round(((sector + Math.PI/2)/TAU*360)) % 360;
    ctx.fillText('SEC ' + String(sec).padStart(3,'0') + '\u00b0', S-3, S-2);

    if(!reducedMotion) requestAnimationFrame(frame);
  }
  frame();
}

setInputMode(SETTINGS.INPUT_MODE);
setTier(tier);
try{ autoArm(); }catch(_e){}
const HINTS = ['SAY \u201cFRIDAY\u201d \u00b7 \u201cJARVIS\u201d','\u201cHEAVY MODE\u201d \u00b7 \u201cLIGHT MODE\u201d','\u201cSERIOUS MODE\u201d \u00b7 \u201cFUN MODE\u201d','\u201cOPEN YOUTUBE\u201d','\u201cEXPORT TRANSCRIPT\u201d','\u201cCLEAR SESSION\u201d'];
(function(){ let hi = 0; const fh = $('footHint');
  if(fh && !reducedMotion) setInterval(()=>{ fh.textContent = HINTS[hi++ % HINTS.length]; }, 5200);
})();
initCore();
try{ initRadar(); }catch(_e){}
lintConfig();
runBoot();

})();
